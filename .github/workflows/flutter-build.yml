name: Test and Publish Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Retain this base so every future run has a newer install version.
      ANDROID_VERSION_CODE_BASE: '1001'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
            pubspec.lock
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Install dependencies and test
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Restore the existing manual-install signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          : "${ANDROID_DEBUG_KEYSTORE_B64:?Signing key missing}"
          install -d -m 0700 "$RUNNER_TEMP/cikscoffee-signing"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cikscoffee-signing/debug.keystore"
          chmod 0600 "$RUNNER_TEMP/cikscoffee-signing/debug.keystore"
          keytool -exportcert -alias androiddebugkey -storepass android \
            -keystore "$RUNNER_TEMP/cikscoffee-signing/debug.keystore" | sha256sum \
            | grep -q 'eed71304c605279ee441a8837992a3cbcb4060625f7ec9177c622d847e9c7c3d'
      - name: Build universal and smaller device APKs
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            export CIKS_ANDROID_KEYSTORE="$RUNNER_TEMP/cikscoffee-signing/debug.keystore"
          fi
          printf '\norg.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m\norg.gradle.workers.max=2\n' >> android/gradle.properties
          python3 tool/build_android_release.py --build-number "$((ANDROID_VERSION_CODE_BASE + GITHUB_RUN_NUMBER))"
      - name: Verify production server and signing identity
        run: |
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for apk in build/android-release/*.apk; do
            python3 tool/verify_production_apk.py "$apk"
            "$tools_dir/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-metadata.txt"
            grep -q "versionCode='$((ANDROID_VERSION_CODE_BASE + GITHUB_RUN_NUMBER))'" "$RUNNER_TEMP/apk-metadata.txt"
            grep -q "name='com.cikscoffee.app'" "$RUNNER_TEMP/apk-metadata.txt"
          done
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            for apk in build/android-release/*.apk; do
              "$tools_dir/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
              cat "$RUNNER_TEMP/apk-certificate.txt"
              grep -q 'eed71304c605279ee441a8837992a3cbcb4060625f7ec9177c622d847e9c7c3d' "$RUNNER_TEMP/apk-certificate.txt"
            done
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: android-production-${{ github.sha }}
          path: build/android-release/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: android-symbols-${{ github.sha }}
          path: build/android-symbols/
          if-no-files-found: error
          retention-days: 90
      - name: Remove signing key from runner
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/cikscoffee-signing/debug.keystore"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-production-${{ github.sha }}
          path: release
      - name: Publish APK to isolated Docker stack
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?}" "${VPS_PORT:?}" "${VPS_USER:?}" "${VPS_SSH_KEY:?}" "${VPS_KNOWN_HOSTS:?}"
          install -d -m 0700 "$RUNNER_TEMP/vps-ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/vps-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/vps-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/vps-ssh/key"
          trap 'rm -f "$RUNNER_TEMP/vps-ssh/key"' EXIT
          digest=$(sha256sum release/app-release.apk | cut -d ' ' -f 1)
          ssh -T -i "$RUNNER_TEMP/vps-ssh/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" "apk $GITHUB_SHA $digest" < release/app-release.apk
          curl --fail --silent --show-error --head --retry 3 --max-time 30 \
            https://cikscoffee.biz.id/downloads/cikscoffee-latest.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          cp release/app-release.apk release/ciks-coffee-mobile.apk
          (cd release && sha256sum ciks-coffee-mobile*.apk > SHA256SUMS.txt)
          printf 'Build otomatis dari main.\n\nCommit: %s\n\nPilih satu APK sesuai perangkat:\n- ciks-coffee-mobile-arm64-v8a.apk: Android ARM 64-bit.\n- ciks-coffee-mobile-armeabi-v7a.apk: Android ARM 32-bit.\n- ciks-coffee-mobile-x86_64.apk: Android x86 64-bit.\n- ciks-coffee-mobile.apk: universal jika jenis perangkat tidak diketahui.\n\nSetiap APK dapat diinstal langsung; tidak perlu memasang beberapa file.\n\nAPK universal: https://cikscoffee.biz.id/downloads/cikscoffee-latest.apk\n' \
            "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          assets=(release/ciks-coffee-mobile.apk release/ciks-coffee-mobile-arm64-v8a.apk release/ciks-coffee-mobile-armeabi-v7a.apk release/ciks-coffee-mobile-x86_64.apk release/SHA256SUMS.txt)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --latest --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --latest \
              --title "CiksCoffee Android ($GITHUB_RUN_NUMBER)" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${assets[@]}"
          fi
          printf 'APK commit %s: https://cikscoffee.biz.id/downloads/cikscoffee-latest.apk\n' \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'APK ARM64 lebih kecil: %s/%s/releases/latest/download/ciks-coffee-mobile-arm64-v8a.apk\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
